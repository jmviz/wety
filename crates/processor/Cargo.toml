[package]
name = "processor"
version = "0.1.0"
edition = "2024"

[dependencies]
wety-core = { path = "../core" }
simd-json = "0.19"
mimalloc = "0.1.52"
bytelines = "2.5"
flate2 = {workspace = true}
anyhow = {workspace = true}
indicatif = "0.18"
clap = { version = "4.6", features = ["derive"] }
regex = "1.13"
strum = "0.28"
unicode-normalization = "0.1.26"
itertools = "0.15"
serde = {workspace = true}
serde_json = {workspace = true}
memmap2 = "0.9"
bytemuck = "1"
rayon = "1.12"
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }
phf = { version = "0.14", features = ["macros"] }
csv = "1.4"
tokenizers = { version = "0.23", default-features = false, features = ["onig"] }
candle-core = "0.11.1"
candle-transformers = "0.11.1"
candle-nn = "0.11.1"
accelerate-src = { version = "0.3.2", optional = true }

# Apple GPUs: Metal for the embedding model, enabled automatically on macOS (the CPU
# path was about 5x slower). Other platforms opt into cuda or accelerate below.
[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { version = "0.11.1", features = ["metal"] }
candle-nn = { version = "0.11.1", features = ["metal"] }
candle-transformers = { version = "0.11.1", features = ["metal"] }

[features]
default = []
cuda = ["candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda"]
metal = ["candle-core/metal", "candle-nn/metal", "candle-transformers/metal"]
accelerate = ["dep:accelerate-src", "candle-core/accelerate", "candle-nn/accelerate", "candle-transformers/accelerate"]
