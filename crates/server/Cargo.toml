[package]
name = "server"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies.wety-core]
path = "../core"

[dependencies]
anyhow = {workspace = true}
serde = {workspace = true}
serde_json = {workspace = true}
axum = "0.8"
tokio = { version = "1.54", features = ["macros", "net", "rt-multi-thread"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["compression-br", "compression-gzip", "cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tower_governor = { version = "0.8", features = ["tracing"] }
axum-extra = { version = "0.12", features = ["query"] }
bytes = "1"
moka = { version = "0.12.16", features = ["sync"] }

[dev-dependencies]
brotli = "9"
flate2 = {workspace = true}
