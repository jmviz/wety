[project]
name = "wety-dating"
version = "0.2.1"
description = "Source-grounded chronological evidence registry for languages, stages and sampled clades"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.0",
    "pydantic>=2.0",
    "jsonschema>=4.0",
    "pymupdf>=1.24",
    "claude-agent-sdk>=0.2.154",
    "keyring>=25.7.0",
    # The Codex CLI the codex backend runs, pinned (the Python SDK's runtime package).
    "openai-codex-cli-bin>=0.160.0",
]

[project.scripts]
dating = "harness.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness"]
