[project]
name = "wety-workflows"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["wety-dating"]

[project.optional-dependencies]
extraction = ["wiktextract", "wikitextprocessor"]

[project.scripts]
wety-data = "workflow_tools.cli:main"
wety-catalogs = "catalogs.build:main"
wety-iecor = "catalogs.iecor:main"
wety-sources = "source_tools.acquire:main"

[tool.uv.sources]
wiktextract = { git = "https://github.com/tatuylonen/wiktextract.git", rev = "4be0ca4fc14f41420cd83daa1aaa837dc5073de9" }
wikitextprocessor = { git = "https://github.com/tatuylonen/wikitextprocessor.git", rev = "e3d6d4edb77618f4d6680edc66e3f774bea59820" }
wety-dating = { path = "packages/dating", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["packages/workflow_tools", "packages/source_tools", "packages/catalogs"]

[tool.uv]
constraint-dependencies = [
