[profile.release]
debug = true

[workspace]
members = [
    "crates/core",
    "crates/processor",
    "crates/server",
    "crates/wiktionary-entries",
]
resolver = "2"

[workspace.dependencies]
anyhow = "1.0.104"
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
